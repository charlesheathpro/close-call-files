name: voice-samples
on:
  push:
    branches: [main]
    paths: ["triggers/voice-samples"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: voice-samples, cancel-in-progress: false }
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 >/dev/null
      - run: pip install requests pillow numpy soundfile
      - run: python pipeline/voice_samples.py $(cat triggers/voice-samples-id 2>/dev/null || echo ccf-test-001)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CCF_WORK: ${{ runner.temp }}/ccf
      - if: always()
        run: bash scripts/commit.sh "Voice samples"
