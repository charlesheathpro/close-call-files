name: upload
on:
  push:
    branches: [main]
    paths: ["triggers/upload"]
  schedule:
    - cron: "41 * * * *"   # hourly, so uploads go out as soon as the 24 h YouTube window reopens
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: upload, cancel-in-progress: false }
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests tzdata
      - run: python pipeline/upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CCF_WORK: ${{ runner.temp }}/ccf
      - if: always()
        run: bash scripts/commit.sh "Upload $(date -u +%Y-%m-%dT%H:%M)"
      # GitHub runs scheduled workflows hours late, so each run stays on watch for about 5.5 hours:
      # every 15 minutes it pulls, and uploads newly passed Shorts or retries once YouTube's 24 h window reopens.
      - name: Stay on watch
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CCF_WORK: ${{ runner.temp }}/ccf
        run: |
          for i in $(seq 1 21); do
            sleep 900
            git pull -q --rebase -X theirs origin main || { git rebase --abort || true; git pull -q --no-rebase -X ours origin main; }
            python pipeline/upload.py --quiet-if-idle || true
            bash scripts/commit.sh "Upload $(date -u +%Y-%m-%dT%H:%M)" || true
          done
