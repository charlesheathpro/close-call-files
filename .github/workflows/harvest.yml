name: harvest
on:
  push:
    branches: [main]
    paths: ["triggers/harvest"]
  schedule:
    - cron: "7 10 * * *"   # about 4 AM Mountain
  workflow_dispatch:
    inputs:
      limit: { description: "max new candidates", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: harvest, cancel-in-progress: false }
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base-en-v1 }
      - run: pip install requests pillow numpy faster-whisper
      - run: |
          extra=""
          grep -qi archive triggers/harvest 2>/dev/null && [ "${{ github.event_name }}" = "push" ] && extra="--archive --limit 250"
          python pipeline/harvest.py $extra ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          CCF_WORK: ${{ runner.temp }}/ccf
          HARVEST_MINUTES: "170"
      - run: bash scripts/commit.sh "Harvest $(date -u +%Y-%m-%d)"
