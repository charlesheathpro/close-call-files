name: check-secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/check-secrets.yml", "pipeline/check_secrets.py", "pipeline/yt.py"]
permissions:
  contents: write
concurrency: { group: repo-writer-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python pipeline/check_secrets.py
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: bash scripts/commit.sh "Secrets check"
