name: stats
on:
  schedule:
    - cron: "5 3 * * *"   # about 9 PM Mountain
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: stats, cancel-in-progress: false }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python pipeline/stats.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: bash scripts/commit.sh "Stats $(date -u +%Y-%m-%d)"
