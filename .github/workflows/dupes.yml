name: dupes
on:
  push:
    branches: [main]
    paths: ["triggers/dupes"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: upload, cancel-in-progress: false }
jobs:
  dupes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests tzdata
      - run: python pipeline/upload.py --report-duplicates
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: bash scripts/commit.sh "Duplicate check $(date -u +%Y-%m-%dT%H:%M)"
